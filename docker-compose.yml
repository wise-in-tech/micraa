services:
  # PostgreSQL : un serveur PostgreSQL réel, installé directement sur l'hôte
  # (plus de conteneur postgres ici). L'app s'y connecte via host.docker.internal
  # - voir le service "app" ci-dessous et le fichier .env (non versionné) pour
  # les identifiants.

  # LiveKit Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: micraa-livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"  # HTTP/WebSocket
      - "7881:7881"  # RTC/TCP fallback
      - "7882:7882/udp"  # RTC/UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - micraa-network

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: micraa-app
    depends_on:
      livekit:
        condition: service_started
    # Permet au conteneur de joindre PostgreSQL installé directement sur
    # l'hôte (et non dans Docker) via le nom host.docker.internal, y compris
    # sous Linux (host-gateway nécessite Docker Engine >= 20.10).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/micraa
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME manquant - voir .env.example}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant - voir .env.example}
      LIVEKIT_URL: wss://livekit.micraa.be
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY manquant - voir .env.example}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET manquant - voir .env.example}
      # Optionnel : vide = connexion Google désactivée
      GOOGLE_AUTH_CLIENT_IDS: ${GOOGLE_AUTH_CLIENT_IDS:-}
    ports:
      - "8080:8080"
    networks:
      - micraa-network

  # HTTPS entrypoint for public API exposure
  caddy:
    image: caddy:2-alpine
    container_name: micraa-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - micraa-network

networks:
  micraa-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
