spring.application.name=micraa

# Server Configuration
server.port=8080

# Database Configuration (when using local Docker PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/micraa
spring.datasource.username=micraa
spring.datasource.password=micraa123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# LiveKit Configuration (when using local Docker LiveKit)
livekit.url=ws://localhost:7880
livekit.api.key=devkey
livekit.api.secret=secret

# Logging
logging.level.com.wiseintech.micraa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
