spring.application.name=micraa-test

# In-memory H2 database so tests don't require a running PostgreSQL instance.
spring.datasource.url=jdbc:h2:mem:micraa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# LiveKit is not reached by the tests below (LiveKitService calls are exercised through
# mocks), but LiveKitConfig still needs values to bind to.
livekit.url=ws://localhost:7880
livekit.api.key=test-key
livekit.api.secret=test-secret-test-secret-test-secret

jwt.secret=test-jwt-secret-key-min-256-bits-for-hs256-algorithm-tests-only
jwt.expiration=604800000

logging.level.com.wiseintech.micraa=INFO
