port: 7880
bind_addresses:
  - "0.0.0.0"

keys:
  devkey: secret

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true

room:
  # Required for the teacher's "unmute a student" moderation action
  # (POST /api/live-classes/{id}/participants/{participantId}/unmute, ticket-001).
  # LiveKit's admin API refuses to unmute a track with HTTP 412 unless this is
  # explicitly enabled - muting alone works without it.
  enable_remote_unmute: true
